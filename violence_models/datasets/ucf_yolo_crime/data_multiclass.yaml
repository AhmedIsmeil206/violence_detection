# UCF-Crime Dataset for YOLO Violence Detection
# Multi-class classification for specific violence types

# Dataset structure
path: a:\AAST\grad proj\code\types\classification\violence_detection\violence_models\datasets\ucf_crime_yolo  # Dataset root dir (absolute path)
train: train/images  # Train images (relative to 'path')
val: val/images      # Validation images (relative to 'path')

# Class definitions for Violence Detection - Multi-class UCF-Crime
names:
  0: non-violent
  1: violent
  2: abuse
  3: arrest
  4: arson
  5: assault
  6: burglary
  7: explosion
  8: fighting
  9: robbery
  10: shooting
  11: shoplifting
  12: stealing
  13: vandalism

# Number of classes
nc: 14

# Class weights for training (optional)
class_weights: [1.0, 1.0, 1.2, 1.1, 1.3, 1.1, 1.2, 1.5, 1.0, 1.2, 1.4, 1.1, 1.1, 1.2]
